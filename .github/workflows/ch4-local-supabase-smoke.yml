name: CH-4 Genuine Local Supabase Integration
on:
  pull_request:
    branches: [integration/ifmvp-controlled-candidate-2026-11-11]
  push:
    branches: [qa/ch4-local-supabase-integration-2026-11-12]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 3.1.0
      - name: Install dependencies
        run: npm ci
      - name: Verify exact application and QA harness SHAs
        run: |
          test "$(git rev-parse HEAD^)" = "6cc0ce8535423a9367ed05f17ecf15e5e1d34c20"
          mkdir -p artifacts/ch4
          {
            echo "application_sha=6cc0ce8535423a9367ed05f17ecf15e5e1d34c20"
            echo "qa_merge_ref_sha=$(git rev-parse HEAD)"
            echo "qa_head_sha=$(git rev-parse origin/qa/ch4-local-supabase-integration-2026-11-12)"
            echo "pr39_ls01_source_sha=50305a1fbbfca147abca1c1495720b11c238db05"
          } > artifacts/ch4/tested-sha.txt
      - name: Verify candidate schema and migration identities
        run: |
          test "$(git hash-object supabase/schema.sql)" = "e859b6de9660533962eddb6f9f3d17ad8a4c1cca"
          test "$(git hash-object supabase/migrations/20261019_inventory_catalog.sql)" = "1f72ad2c8d643ec2d536225d8c8c09992d53cdc3"
          test "$(git hash-object supabase/migrations/20261102_p0_idempotency.sql)" = "03c9cb2940799731d614e97a9b48da2d9418f707"
          test "$(git hash-object supabase/migrations/202611110001_invoice_first_foundation.sql)" = "c7dfb445b02d3fdba196ed26f2d814674f4c9f11"
      - name: Start disposable Supabase stack
        run: |
          supabase start -x studio,storage-api,realtime,imgproxy,mailpit,edge-runtime,logflare,vector > "$RUNNER_TEMP/ch4-start.log" 2>&1 || { sed -E 's/eyJ[A-Za-z0-9._-]+/[REDACTED_JWT]/g; s/sb_secret_[A-Za-z0-9_-]+/[REDACTED_SECRET]/g' "$RUNNER_TEMP/ch4-start.log"; exit 1; }
      - name: Capture service versions and local-only credentials
        shell: bash
        run: |
          mkdir -p artifacts/ch4
          supabase --version > artifacts/ch4/supabase-cli-version.txt
          supabase services > artifacts/ch4/supabase-services.txt
          docker ps --format '{{.Names}} {{.Image}}' | sort > artifacts/ch4/docker-images.txt
          supabase status -o env > "$RUNNER_TEMP/ch4-local.env"
          chmod 600 "$RUNNER_TEMP/ch4-local.env"
          set -a; source "$RUNNER_TEMP/ch4-local.env"; set +a
          auth_container="$(docker ps --format '{{.Names}}' | grep '^supabase_auth_' | head -n1)"
          jwt_secret="$(docker inspect "$auth_container" --format '{{range .Config.Env}}{{println .}}{{end}}' | sed -n 's/^GOTRUE_JWT_SECRET=//p' | head -n1)"
          test -n "$jwt_secret"
          echo "::add-mask::$jwt_secret"
          echo "CH4_LOCAL_JWT_SECRET=$jwt_secret" >> "$GITHUB_ENV"
          {
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_DB_URL=$DB_URL"
            echo "SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
          } >> "$GITHUB_ENV"
          printf '{"api_url":"http://127.0.0.1:54321","db_host":"127.0.0.1","db_port":54322,"supabase_cli":"3.1.0","auth":"GoTrue","rest":"PostgREST","environment":"ephemeral-local"}\n' > artifacts/ch4/supabase-environment.json
      - name: Enforce endpoint guard before database operations
        run: node --test tests/local-supabase-guard.test.mjs
      - name: Apply pinned baseline and invoice migration
        run: bash scripts/test-local-supabase.sh
      - name: Run Auth suite and preserve its exit code
        id: auth
        continue-on-error: true
        run: |
          node --test --test-reporter=junit --test-reporter-destination=artifacts/ch4/auth-test-results.xml tests/ch4/auth-postgrest.test.mjs
      - name: Run PostgREST/RLS suite and preserve its exit code
        id: postgrest
        if: always()
        continue-on-error: true
        run: |
          node --test --test-reporter=junit --test-reporter-destination=artifacts/ch4/postgrest-rls-results.xml tests/ch4/tenant-isolation.test.mjs
      - name: Build Next.js independently
        id: build
        if: always()
        continue-on-error: true
        run: npm run build
      - name: Start Next.js and run actual GET routes
        id: routes
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          if [ -d .next ]; then
            npm run start > "$RUNNER_TEMP/next.log" 2>&1 &
            echo $! > "$RUNNER_TEMP/next.pid"
            for i in $(seq 1 60); do
              if curl --silent --fail http://127.0.0.1:3000 >/dev/null; then break; fi
              sleep 1
            done
            node --test --test-reporter=junit --test-reporter-destination=artifacts/ch4/api-route-results.xml tests/ch4/api-routes.test.mjs
          else
            echo "BLOCKED: Next.js build unavailable" > artifacts/ch4/routes-blocked.txt
            exit 1
          fi
      - name: Verify issue gate and no issuance side effects
        id: safety
        if: always()
        continue-on-error: true
        run: |
          psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -Atc "select case when issue_enabled then 't' else 'f' end from public.invoice_runtime_controls where control_key='invoice_issue'" | grep -qx f
          psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -Atc "select count(*) from public.invoices i where i.id not in (select id from public.invoices where id in (select invoice_id from public.invoice_lines where item_name_snapshot like '%fixture'))" > artifacts/ch4/unexpected-invoices-count.txt
          grep -qx 0 artifacts/ch4/unexpected-invoices-count.txt
          printf '{"issue_flag":"OFF","issuance_rpc_invoked":false,"unexpected_invoice_rows":0,"fixture_scope":"ephemeral_local_database"}\n' > artifacts/ch4/safety-checks.json
      - name: Assemble failure matrix and completion summary
        if: always()
        env:
          AUTH_OUTCOME: ${{ steps.auth.outcome }}
          POSTGREST_OUTCOME: ${{ steps.postgrest.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          ROUTES_OUTCOME: ${{ steps.routes.outcome }}
          SAFETY_OUTCOME: ${{ steps.safety.outcome }}
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const cases = ["auth","postgrest","build","routes","safety"];
          const values = Object.fromEntries(cases.map(k => [k, process.env[k.toUpperCase()+"_OUTCOME"] || "missing"]));
          fs.writeFileSync("artifacts/ch4/failure-matrix.json", JSON.stringify(values,null,2)+"\n");
          const bad = cases.filter(k => values[k] !== "success");
          fs.writeFileSync("artifacts/ch4/summary.md", "# CH-4 run summary\n\n"+cases.map(k=>"- "+k+": "+values[k]).join("\n")+"\n\nOverall: "+(bad.length ? "INCOMPLETE" : "suite steps successful")+"\n");
          NODE
      - name: Cleanup disposable stack and immutable fixtures
        if: always()
        shell: bash
        run: |
          set +e
          if [ -f "$RUNNER_TEMP/next.pid" ]; then kill "$(cat "$RUNNER_TEMP/next.pid")" 2>/dev/null; fi
          supabase stop --no-backup
          stop_rc=$?
          printf "supabase_stop_exit=%s\nfixture_lifecycle=entire_disposable_database_destroyed\nfixture_user_deletion=recorded_in_test_evidence\n" "$stop_rc" > artifacts/ch4/cleanup-report.txt
          exit "$stop_rc"
      - name: Upload redacted evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ch4-local-supabase-integration-evidence
          path: artifacts/ch4/
          if-no-files-found: warn
          retention-days: 14
      - name: Fail workflow when any mandatory suite is not successful
        if: always()
        env:
          AUTH_OUTCOME: ${{ steps.auth.outcome }}
          POSTGREST_OUTCOME: ${{ steps.postgrest.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          ROUTES_OUTCOME: ${{ steps.routes.outcome }}
          SAFETY_OUTCOME: ${{ steps.safety.outcome }}
        run: |
          test "$AUTH_OUTCOME" = success
          test "$POSTGREST_OUTCOME" = success
          test "$BUILD_OUTCOME" = success
          test "$ROUTES_OUTCOME" = success
          test "$SAFETY_OUTCOME" = success

name: CH-4 Genuine Local Supabase Integration
on:
  pull_request:
    branches: [integration/ifmvp-controlled-candidate-2026-11-11]
  push:
    branches: [qa/ch4-local-supabase-integration-2026-11-12]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 3.1.0
      - name: Install dependencies
        run: npm ci
      - name: Verify exact application and QA harness SHAs
        run: |
          test "$(git merge-base HEAD 6cc0ce8535423a9367ed05f17ecf15e5e1d34c20)" = "6cc0ce8535423a9367ed05f17ecf15e5e1d34c20"
          mkdir -p artifacts/ch4
          {
            echo "application_sha=6cc0ce8535423a9367ed05f17ecf15e5e1d34c20"
            echo "qa_merge_ref_sha=$(git rev-parse HEAD)"
            echo "qa_head_sha=$(git rev-parse origin/qa/ch4-local-supabase-integration-2026-11-12)"
            echo "pr39_ls01_source_sha=50305a1fbbfca147abca1c1495720b11c238db05"
          } > artifacts/ch4/tested-sha.txt
      - name: Verify candidate schema and migration identities
        run: |
          test "$(git hash-object supabase/schema.sql)" = "e859b6de9660533962eddb6f9f3d17ad8a4c1cca"
          test "$(git hash-object supabase/migrations/20261019_inventory_catalog.sql)" = "1f72ad2c8d643ec2d536225d8c8c09992d53cdc3"
          test "$(git hash-object supabase/migrations/20261102_p0_idempotency.sql)" = "03c9cb2940799731d614e97a9b48da2d9418f707"
          test "$(git hash-object supabase/migrations/202611110001_invoice_first_foundation.sql)" = "c7dfb445b02d3fdba196ed26f2d814674f4c9f11"
      - name: Start disposable Supabase stack
        run: |
          supabase start -x studio,storage-api,realtime,imgproxy,mailpit,edge-runtime,logflare,vector > "$RUNNER_TEMP/ch4-start.log" 2>&1 || { sed -E 's/eyJ[A-Za-z0-9._-]+/[REDACTED_JWT]/g; s/sb_secret_[A-Za-z0-9_-]+/[REDACTED_SECRET]/g' "$RUNNER_TEMP/ch4-start.log"; exit 1; }
      - name: Capture service versions and local-only credentials
        shell: bash
        run: |
          mkdir -p artifacts/ch4
          supabase --version > artifacts/ch4/supabase-cli-version.txt
          supabase services > artifacts/ch4/supabase-services.txt
          docker ps --format '{{.Names}} {{.Image}}' | sort > artifacts/ch4/docker-images.txt
          supabase status -o env > "$RUNNER_TEMP/ch4-local.env"
          chmod 600 "$RUNNER_TEMP/ch4-local.env"
          set -a; source "$RUNNER_TEMP/ch4-local.env"; set +a
          auth_container="$(docker ps --format '{{.Names}}' | grep '^supabase_auth_' | head -n1)"
          jwt_secret="$(docker inspect "$auth_container" --format '{{range .Config.Env}}{{println .}}{{end}}' | sed -n 's/^GOTRUE_JWT_SECRET=//p' | head -n1)"
          test -n "$jwt_secret"
          echo "::add-mask::$jwt_secret"
          echo "CH4_LOCAL_JWT_SECRET=$jwt_secret" >> "$GITHUB_ENV"
          {
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_DB_URL=$DB_URL"
            echo "SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
          } >> "$GITHUB_ENV"
          printf '{"api_url":"http://127.0.0.1:54321","db_host":"127.0.0.1","db_port":54322,"supabase_cli":"3.1.0","auth":"GoTrue","rest":"PostgREST","environment":"ephemeral-local"}\n' > artifacts/ch4/supabase-environment.json
      - name: Enforce endpoint guard before database operations
        run: node --test tests/local-supabase-guard.test.mjs
      - name: Apply pinned baseline and invoice migration
        run: bash scripts/test-local-supabase.sh
      - name: Start local PostgREST fault-injection proxy
        id: proxy
        run: |
          node tests/ch4/supabase-fault-proxy.mjs > "$RUNNER_TEMP/ch4-proxy.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/ch4-proxy.pid"
          for i in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:54329/__ch4/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/ch4-proxy.log"
          exit 1
      - name: Run Auth suite and preserve its exit code
        id: auth
        continue-on-error: true
        run: |
          node --test --test-reporter=junit --test-reporter-destination=artifacts/ch4/auth-test-results.xml tests/ch4/auth-postgrest.test.mjs
      - name: Run PostgREST/RLS suite and preserve its exit code
        id: postgrest
        if: always()
        continue-on-error: true
        run: |
          node --test --test-reporter=junit --test-reporter-destination=artifacts/ch4/postgrest-rls-results.xml tests/ch4/tenant-isolation.test.mjs
      - name: Build Next.js independently
        id: build
        if: always()
        continue-on-error: true
        run: NEXT_PUBLIC_SUPABASE_URL=http://127.0.0.1:54329 npm run build
      - name: Start Next.js and run actual GET routes
        id: routes
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          if [ -d .next ]; then
            npm run start > "$RUNNER_TEMP/next.log" 2>&1 &
            echo $! > "$RUNNER_TEMP/next.pid"
            for i in $(seq 1 60); do
              if curl --silent --fail http://127.0.0.1:3000 >/dev/null; then break; fi
              sleep 1
            done
            node --test --test-reporter=junit --test-reporter-destination=artifacts/ch4/api-route-results.xml tests/ch4/api-routes.test.mjs
          else
            echo "BLOCKED: Next.js build unavailable" > artifacts/ch4/routes-blocked.txt
            exit 1
          fi
      - name: Verify issue gate and no issuance side effects
        id: safety
        if: always()
        continue-on-error: true
        run: |
          issue_flag="$(psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -Atc "select case when issue_enabled then 'true' else 'false' end from public.invoice_runtime_controls where control_key='invoice_issue'")"
          test "$issue_flag" = false
          psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -Atc "select coalesce(json_agg(json_build_object('id',id,'shop_id',shop_id,'namespace',idempotency_namespace,'request_id',request_id) order by id),'[]'::json)::text from public.invoices where idempotency_namespace in ('ch4-fixture','ch4-route')" > artifacts/ch4/fixture-ids.json
          unexpected="$(psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -Atc "select count(*) from public.invoices where idempotency_namespace not in ('ch4-fixture','ch4-route')")"
          test "$unexpected" = 0
          status_events="$(psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -Atc "select count(*) from public.invoice_status_events")"
          audit_events="$(psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -Atc "select count(*) from public.invoice_audit_events")"
          test "$status_events" = 0
          test "$audit_events" = 0
          if grep -R -q "rpc/create_invoice_transaction" tests/ch4; then echo "Forbidden issuance RPC invocation found in QA tests" >&2; exit 1; fi
          psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -Atc "select json_build_object('issue_flag','OFF','invoice_issue_rpc_calls_in_test_sources',0,'unexpected_invoice_rows',$unexpected,'fixture_invoices',(select count(*) from public.invoices where idempotency_namespace in ('ch4-fixture','ch4-route')),'status_events',$status_events,'audit_events',$audit_events,'fixture_ids',(select coalesce(json_agg(json_build_object('id',id,'shop_id',shop_id,'namespace',idempotency_namespace)),'[]'::json) from public.invoices where idempotency_namespace in ('ch4-fixture','ch4-route')))::text" > artifacts/ch4/safety-checks.json
      - name: Capture security catalog and combine redacted HTTP transcripts
        if: always()
        run: |
          if [ -n "${SUPABASE_DB_URL:-}" ]; then
            psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -Atc "select json_build_object(
              'tables',(select coalesce(json_agg(json_build_object('name',c.relname,'rls',c.relrowsecurity,'anon_select',has_table_privilege('anon','public.'||c.relname,'SELECT'),'authenticated_select',has_table_privilege('authenticated','public.'||c.relname,'SELECT'),'authenticated_insert',has_table_privilege('authenticated','public.'||c.relname,'INSERT'),'authenticated_update',has_table_privilege('authenticated','public.'||c.relname,'UPDATE'),'authenticated_delete',has_table_privilege('authenticated','public.'||c.relname,'DELETE'))),'[]'::json) from pg_class c join pg_namespace n on n.oid=c.relnamespace where n.nspname='public' and c.relname in ('invoices','invoice_lines','invoice_counters','invoice_idempotency','invoice_status_events','invoice_audit_events','invoice_runtime_controls')),
              'policies',(select coalesce(json_agg(json_build_object('table',tablename,'name',policyname,'command',cmd,'roles',roles,'qual',qual,'with_check',with_check)),'[]'::json) from pg_policies where schemaname='public' and tablename in ('invoices','invoice_lines')),
              'triggers',(select coalesce(json_agg(json_build_object('table',c.relname,'name',t.tgname,'enabled',t.tgenabled)),'[]'::json) from pg_trigger t join pg_class c on c.oid=t.tgrelid join pg_namespace n on n.oid=c.relnamespace where n.nspname='public' and c.relname in ('invoices','invoice_lines') and not t.tgisinternal),
              'rpc_acl',json_build_object('anon_execute',has_function_privilege('anon','public.create_invoice_transaction(uuid,text,uuid,jsonb)','EXECUTE'),'authenticated_execute',has_function_privilege('authenticated','public.create_invoice_transaction(uuid,text,uuid,jsonb)','EXECUTE')),
              'issue_flag',(select issue_enabled from public.invoice_runtime_controls where control_key='invoice_issue')
            )::text" > artifacts/ch4/security-catalog.json
          else
            printf '{"status":"BLOCKED","reason":"disposable Supabase database was not available"}\n' > artifacts/ch4/security-catalog.json
          fi
          node - <<'NODE'
          const fs=require('fs');
          const names=["http-transcript-auth.json","http-transcript-postgrest.json","http-transcript-routes.json"];
          const all=[];
          for(const n of names){if(fs.existsSync("artifacts/ch4/"+n)){try{all.push(...JSON.parse(fs.readFileSync("artifacts/ch4/"+n,"utf8")));}catch(e){all.push({source:n,parseError:String(e)});}}}
          fs.writeFileSync("artifacts/ch4/http-transcript.json",JSON.stringify(all,null,2)+"\n");
          const clean=["cleanup-auth-users.json","cleanup-postgrest-users.json","cleanup-route-users.json"];
          const evidence=[];
          for(const n of clean){if(fs.existsSync("artifacts/ch4/"+n)){try{evidence.push(...JSON.parse(fs.readFileSync("artifacts/ch4/"+n,"utf8")));}catch(e){evidence.push({source:n,parseError:String(e)});}}}
          fs.writeFileSync("artifacts/ch4/cleanup-users.json",JSON.stringify(evidence,null,2)+"\n");
          NODE
      - name: Intentional failure-path probe before unconditional cleanup
        id: cleanup_failure_probe
        if: always()
        continue-on-error: true
        run: |
          echo "CH4_EXPECTED_FAILURE_PROBE=exit-73"
          exit 73
      - name: Cleanup disposable stack and immutable fixtures
        if: always()
        shell: bash
        run: |
          set +e
          if [ -f "$RUNNER_TEMP/next.pid" ]; then kill "$(cat "$RUNNER_TEMP/next.pid")" 2>/dev/null; fi
          if [ -f "$RUNNER_TEMP/ch4-proxy.pid" ]; then kill "$(cat "$RUNNER_TEMP/ch4-proxy.pid")" 2>/dev/null; fi
          supabase stop --no-backup
          stop_rc=$?
          printf "supabase_stop_exit=%s\nfixture_lifecycle=entire_disposable_database_destroyed\nfixture_user_deletion=recorded_in_test_evidence\n" "$stop_rc" > artifacts/ch4/cleanup-report.txt
          exit "$stop_rc"
      - name: Assemble failure matrix and completion summary
        if: always()
        env:
          AUTH_OUTCOME: ${{ steps.auth.outcome }}
          POSTGREST_OUTCOME: ${{ steps.postgrest.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          ROUTES_OUTCOME: ${{ steps.routes.outcome }}
          SAFETY_OUTCOME: ${{ steps.safety.outcome }}
          CLEANUP_FAILURE_PROBE_OUTCOME: ${{ steps.cleanup_failure_probe.outcome }}
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = "artifacts/ch4/";
          const cases = ["auth","postgrest","build","routes","safety"];
          const values = Object.fromEntries(cases.map(k => [k, process.env[k.toUpperCase()+"_OUTCOME"] || "missing"]));
          values.cleanupFailurePathProbe = process.env.CLEANUP_FAILURE_PROBE_OUTCOME === "failure" ? "expected-failure-observed" : (process.env.CLEANUP_FAILURE_PROBE_OUTCOME || "missing");
          fs.writeFileSync(path+"failure-matrix.json", JSON.stringify(values,null,2)+"\n");
          let executed=0, skipped=0, todo=0, failures=0;
          for (const name of ["auth-test-results.xml","postgrest-rls-results.xml","api-route-results.xml"]) {
            const file=path+name;
            if (!fs.existsSync(file)) { failures++; continue; }
            const xml=fs.readFileSync(file,"utf8");
            executed += (xml.match(/<testcase\b/g) || []).length;
            skipped += (xml.match(/<skipped\b/g) || []).length;
            failures += (xml.match(/<failure\b/g) || []).length + (xml.match(/<error\b/g) || []).length;
            const todoMatch=xml.match(/<!--\s*todo\s+(\d+)\s*-->/i);
            todo += todoMatch ? Number(todoMatch[1]) : 0;
          }
          for (const name of ["tenant-isolation.json","route-evidence.json","auth-evidence.json","security-catalog.json","http-transcript.json","safety-checks.json","cleanup-report.txt"]) {
            if (!fs.existsSync(path+name)) failures++;
          }
          const cleanup=fs.existsSync(path+"cleanup-report.txt") ? fs.readFileSync(path+"cleanup-report.txt","utf8") : "missing";
          const cleanupUsers=fs.existsSync(path+"cleanup-users.json") ? JSON.parse(fs.readFileSync(path+"cleanup-users.json","utf8")) : [];
          const verifiedUsers=cleanupUsers.filter(x=>x.deletionStatus==="VERIFIED"||x.deletionVerified===true).length;
          const unverifiedUsers=cleanupUsers.filter(x=>x.deletionStatus==="NOT_VERIFIED_STACK_DISPOSAL_REQUIRED"||x.disposition==="NOT_VERIFIED_STACK_DISPOSAL_REQUIRED").length;
          fs.writeFileSync(path+"test-counts.json",JSON.stringify({executed,skipped,todo,failures},null,2)+"\n");
          const failedSuites=cases.filter(k=>values[k]!=="success");
          const cleanupComplete=cleanup.includes("supabase_stop_exit=0") && cleanup.includes("fixture_lifecycle=entire_disposable_database_destroyed");
          const failurePathVerified=process.env.CLEANUP_FAILURE_PROBE_OUTCOME==="failure";
          const complete=failedSuites.length===0 && skipped===0 && todo===0 && failures===0 && executed>0 && cleanupComplete && failurePathVerified;
          const summary="# CH-4 run summary\n\n"+cases.map(k=>"- "+k+": "+values[k]).join("\n")+"\n\nExecuted: "+executed+"\nSkipped: "+skipped+"\nTODO: "+todo+"\nJUnit failures/errors: "+failures+"\nIndividual GoTrue user deletion: "+verifiedUsers+" verified, "+unverifiedUsers+" NOT VERIFIED (FK references preserved; disposable database teardown is authoritative)\nDisposable stack teardown: "+(cleanupComplete?"PASS":"FAIL")+"\n\nOverall: "+(complete?"COMPLETE":"INCOMPLETE")+"\n";
          fs.writeFileSync(path+"summary.md",summary);
          if (!complete) process.exitCode=1;
          NODE
      - name: Upload redacted evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ch4-local-supabase-integration-evidence
          path: artifacts/ch4/
          if-no-files-found: warn
          retention-days: 14
      - name: Fail workflow when any mandatory suite is not successful
        if: always()
        env:
          AUTH_OUTCOME: ${{ steps.auth.outcome }}
          POSTGREST_OUTCOME: ${{ steps.postgrest.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          ROUTES_OUTCOME: ${{ steps.routes.outcome }}
          SAFETY_OUTCOME: ${{ steps.safety.outcome }}
          CLEANUP_FAILURE_PROBE_OUTCOME: ${{ steps.cleanup_failure_probe.outcome }}
        run: |
          test "$AUTH_OUTCOME" = success
          test "$POSTGREST_OUTCOME" = success
          test "$BUILD_OUTCOME" = success
          test "$ROUTES_OUTCOME" = success
          test "$SAFETY_OUTCOME" = success
          test "$CLEANUP_FAILURE_PROBE_OUTCOME" = failure

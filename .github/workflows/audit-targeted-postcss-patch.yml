name: Targeted audit remediation candidate
on:
  push:
    branches:
      - corrective/a6-a4-print-controlled-2026-11-17
    paths:
      - ".github/workflows/audit-targeted-postcss-patch.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: corrective/a6-a4-print-controlled-2026-11-17
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install PDF verification tools required by the existing test suite
        run: |
          sudo apt-get update
          sudo apt-get install -y ghostscript poppler-utils
      - name: Apply only the PostCSS selector parser security patch
        run: |
          npm pkg set 'overrides.postcss-selector-parser=6.1.5'
          npm pkg set 'overrides.@typescript-eslint/eslint-plugin=8.73.0'
          npm pkg set 'overrides.@typescript-eslint/parser=8.73.0'
          npm pkg set 'overrides.@typescript-eslint/project-service=8.73.0'
          npm pkg set 'overrides.@typescript-eslint/scope-manager=8.73.0'
          npm pkg set 'overrides.@typescript-eslint/tsconfig-utils=8.73.0'
          npm pkg set 'overrides.@typescript-eslint/type-utils=8.73.0'
          npm pkg set 'overrides.@typescript-eslint/types=8.73.0'
          npm pkg set 'overrides.@typescript-eslint/typescript-estree=8.73.0'
          npm pkg set 'overrides.@typescript-eslint/utils=8.73.0'
          npm pkg set 'overrides.@typescript-eslint/visitor-keys=8.73.0'
          npm install --package-lock-only --ignore-scripts --no-audit
      - name: Install from candidate lockfile
        run: npm ci
      - name: Test, lint, typecheck and build candidate
        run: |
          npm test
          npm run lint
          npm run typecheck
          npm run build
      - name: Capture candidate audit and lock evidence
        if: always()
        run: |
          set +e
          npm audit --json > npm-audit-candidate.json
          audit_code=$?
          echo "npm audit exit code: $audit_code"
          node -e 'const r=require("./npm-audit-candidate.json"); const v=r.metadata?.vulnerabilities||{}; console.log(JSON.stringify(v,null,2)); if ((v.total||0)!==0) process.exit(1)'
          test "$audit_code" -eq 0
          npm ls postcss-selector-parser minimatch --all > dependency-tree.txt 2>&1
          npm ls postcss-selector-parser minimatch --all || true
      - name: Commit validated dependency manifest and lockfile
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "fix: patch audited development dependencies"
          git push origin HEAD:refs/heads/corrective/a6-a4-print-controlled-2026-11-17
      - name: Upload candidate package and lock files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: targeted-postcss-patch-candidate
          path: |
            package.json
            package-lock.json
            npm-audit-candidate.json
            dependency-tree.txt
          retention-days: 30

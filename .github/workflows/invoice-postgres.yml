name: Invoice PostgreSQL integration
on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/ifmvp-backend-foundation]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  invoice-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16
      - name: Install application dependencies
        run: npm ci
      - name: Execute disposable PostgreSQL harness
        run: npm run test:invoice:postgres
      - name: Run application unit and SQL tests
        run: |
          npm test
          npm run verify:sql
          node scripts/verify-invoice-sql.mjs
      - name: Lint, typecheck and production build
        run: |
          npm run lint
          npm run typecheck
          npm run build

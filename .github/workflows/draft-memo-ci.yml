name: DokanTools V1 Delivery CI
on:
  push:
    branches:
      - delivery/dokantools-v1-2026-11-19
  pull_request:
    branches:
      - delivery/dokantools-v1-2026-11-19
permissions:
  contents: read
jobs:
  application:
    name: Application build and startup
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact candidate SHA and record workflow identity
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
          WORKFLOW_EVENT: ${{ github.event_name }}
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          echo "PR head SHA: ${PR_HEAD_SHA:-not-applicable}" >> "$GITHUB_STEP_SUMMARY"
          echo "Expected checkout SHA: $EXPECTED_HEAD_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Actual git rev-parse HEAD: $actual" >> "$GITHUB_STEP_SUMMARY"
          echo "Workflow event: $WORKFLOW_EVENT" >> "$GITHUB_STEP_SUMMARY"
          test "$actual" = "$EXPECTED_HEAD_SHA"
          mkdir -p artifacts
          printf '{\"prHeadSha\":\"%s\",\"expectedCheckoutSha\":\"%s\",\"actualCheckoutSha\":\"%s\",\"workflowEvent\":\"%s\"}\n' "$PR_HEAD_SHA" "$EXPECTED_HEAD_SHA" "$actual" "$WORKFLOW_EVENT" > artifacts/commit-identity.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Node dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: TypeScript check
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Start production server and smoke-test homepage
        run: |
          npm run start -- --hostname 127.0.0.1 > /tmp/dokantools-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/ -o /tmp/dokantools-home.html; then
              grep -q 'দোকানের হিসাব এখন' /tmp/dokantools-home.html
              exit $?
            fi
            sleep 2
          done
          cat /tmp/dokantools-next.log
          exit 1
  tests:
    name: Unit tests (including A6 PDF assertions)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact candidate SHA and record workflow identity
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
          WORKFLOW_EVENT: ${{ github.event_name }}
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          echo "PR head SHA: ${PR_HEAD_SHA:-not-applicable}" >> "$GITHUB_STEP_SUMMARY"
          echo "Expected checkout SHA: $EXPECTED_HEAD_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Actual git rev-parse HEAD: $actual" >> "$GITHUB_STEP_SUMMARY"
          echo "Workflow event: $WORKFLOW_EVENT" >> "$GITHUB_STEP_SUMMARY"
          test "$actual" = "$EXPECTED_HEAD_SHA"
          mkdir -p artifacts
          printf '{\"prHeadSha\":\"%s\",\"expectedCheckoutSha\":\"%s\",\"actualCheckoutSha\":\"%s\",\"workflowEvent\":\"%s\"}\n' "$PR_HEAD_SHA" "$EXPECTED_HEAD_SHA" "$actual" "$WORKFLOW_EVENT" > artifacts/commit-identity.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Node dependencies
        run: npm ci
      - name: Install Poppler required by A6 tests
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Run full test suite
        run: npm test
  category-integrity:
    name: PostgreSQL 17 category tenant-integrity regression
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: dokantools_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dokantools_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact candidate SHA and record workflow identity
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
          WORKFLOW_EVENT: ${{ github.event_name }}
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          echo "PR head SHA: ${PR_HEAD_SHA:-not-applicable}" >> "$GITHUB_STEP_SUMMARY"
          echo "Expected checkout SHA: $EXPECTED_HEAD_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Actual git rev-parse HEAD: $actual" >> "$GITHUB_STEP_SUMMARY"
          echo "Workflow event: $WORKFLOW_EVENT" >> "$GITHUB_STEP_SUMMARY"
          test "$actual" = "$EXPECTED_HEAD_SHA"
          mkdir -p artifacts
          printf '{\"prHeadSha\":\"%s\",\"expectedCheckoutSha\":\"%s\",\"actualCheckoutSha\":\"%s\",\"workflowEvent\":\"%s\"}\n' "$PR_HEAD_SHA" "$EXPECTED_HEAD_SHA" "$actual" "$WORKFLOW_EVENT" > artifacts/commit-identity.json
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Bootstrap disposable Supabase-compatible schema
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d dokantools_test -v ON_ERROR_STOP=1 -f supabase/tests/fixtures/category_integrity_schema.sql
      - name: Apply corrected category migration to disposable CI database
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d dokantools_test -v ON_ERROR_STOP=1 -f supabase/migrations/202611180001_item_categories.sql
      - name: Run positive and negative category integrity tests (transaction rolls back)
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d dokantools_test -v ON_ERROR_STOP=1 -f supabase/tests/20261119_item_categories_tenant_integrity.sql
  pdf-qa:
    name: A6 PDF artifact verification
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact candidate SHA and record workflow identity
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
          WORKFLOW_EVENT: ${{ github.event_name }}
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          echo "PR head SHA: ${PR_HEAD_SHA:-not-applicable}" >> "$GITHUB_STEP_SUMMARY"
          echo "Expected checkout SHA: $EXPECTED_HEAD_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Actual git rev-parse HEAD: $actual" >> "$GITHUB_STEP_SUMMARY"
          echo "Workflow event: $WORKFLOW_EVENT" >> "$GITHUB_STEP_SUMMARY"
          test "$actual" = "$EXPECTED_HEAD_SHA"
          mkdir -p artifacts
          printf '{\"prHeadSha\":\"%s\",\"expectedCheckoutSha\":\"%s\",\"actualCheckoutSha\":\"%s\",\"workflowEvent\":\"%s\"}\n' "$PR_HEAD_SHA" "$EXPECTED_HEAD_SHA" "$actual" "$WORKFLOW_EVENT" > artifacts/commit-identity.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install PDF inspection tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Verify retained A6 PDF geometry and content
        run: node scripts/verify-a6-pdf.mjs docs/evidence/draft-memo-a6-demo.pdf
  browser-e2e:
    name: Chromium authenticated V1 workflow and fresh A6 PDF
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact candidate SHA and record workflow identity
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
          WORKFLOW_EVENT: ${{ github.event_name }}
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          echo "PR head SHA: ${PR_HEAD_SHA:-not-applicable}" >> "$GITHUB_STEP_SUMMARY"
          echo "Expected checkout SHA: $EXPECTED_HEAD_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Actual git rev-parse HEAD: $actual" >> "$GITHUB_STEP_SUMMARY"
          echo "Workflow event: $WORKFLOW_EVENT" >> "$GITHUB_STEP_SUMMARY"
          test "$actual" = "$EXPECTED_HEAD_SHA"
          mkdir -p artifacts
          printf '{\"prHeadSha\":\"%s\",\"expectedCheckoutSha\":\"%s\",\"actualCheckoutSha\":\"%s\",\"workflowEvent\":\"%s\"}\n' "$PR_HEAD_SHA" "$EXPECTED_HEAD_SHA" "$actual" "$WORKFLOW_EVENT" > artifacts/commit-identity.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install PostgreSQL client and PDF inspection tools
        run: sudo apt-get update && sudo apt-get install -y postgresql-client poppler-utils
      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 3.1.0
      - name: Install application dependencies
        run: npm ci
      - name: Start disposable local Supabase Auth and PostgreSQL
        run: supabase start -x studio,storage-api,realtime,imgproxy,mailpit,edge-runtime,logflare,vector
      - name: Create minimal V1 QA schema (fixture only; no migration execution)
        shell: bash
        run: |
          supabase status -o env > "$RUNNER_TEMP/supabase.env"
          set -a
          source "$RUNNER_TEMP/supabase.env"
          set +a
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/tests/fixtures/v1_browser_qa_schema.sql
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "DOKANTOOLS_QA_URL=http://127.0.0.1:3000"
            echo "DOKANTOOLS_REQUIRE_CATEGORIES=true"
          } >> "$GITHUB_ENV"
          echo "::add-mask::$SERVICE_ROLE_KEY"
          echo "DOKANTOOLS_LOCAL_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY" >> "$GITHUB_ENV"
      - name: Create disposable synthetic Supabase Auth user
        shell: bash
        run: |
          email="v1-browser-${GITHUB_RUN_ID}@example.test"
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          payload="$(jq -n --arg email "$email" --arg password "$password" '{email:$email,password:$password,email_confirm:true}')"
          status="$(curl --silent --show-error -o "$RUNNER_TEMP/auth-user.json" -w '%{http_code}' \
            -X POST "$NEXT_PUBLIC_SUPABASE_URL/auth/v1/admin/users" \
            -H "apikey: $DOKANTOOLS_LOCAL_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $DOKANTOOLS_LOCAL_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" -d "$payload")"
          test "$status" = "200" || test "$status" = "201"
          user_id="$(jq -er '.id | select(type == "string" and length > 0)' "$RUNNER_TEMP/auth-user.json")"
          {
            echo "DOKANTOOLS_QA_EMAIL=$email"
            echo "DOKANTOOLS_QA_PASSWORD=$password"
            echo "DOKANTOOLS_QA_USER_ID=$user_id"
          } >> "$GITHUB_ENV"
          unset password payload
      - name: Build production application against local Supabase
        run: npm run build
      - name: Start production application
        shell: bash
        run: |
          npm run start -- --hostname 127.0.0.1 > "$RUNNER_TEMP/next.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/next.pid"
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/ >/dev/null; then exit 0; fi
            sleep 2
          done
          cat "$RUNNER_TEMP/next.log"
          exit 1
      - name: Install pinned Playwright Chromium
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.56.1
          npx playwright install --with-deps chromium
      - name: Run real Chromium authenticated V1 workflow
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/test-results.json
        run: npx playwright test qa/browser/v1-functional.spec.mjs --reporter=line,json --workers=1
      - name: Stamp Playwright test results with exact commit identity
        if: always()
        shell: bash
        run: |
          if [ -f test-results/test-results.json ]; then
            node -e 'const fs=require("node:fs");const p="test-results/test-results.json";const r=JSON.parse(fs.readFileSync(p,"utf8"));r.metadata={...(r.metadata||{}),commitIdentity:JSON.parse(fs.readFileSync("artifacts/commit-identity.json","utf8"))};fs.writeFileSync(p,JSON.stringify(r,null,2));'
          fi
      - name: Verify fresh application-generated A6 PDF
        if: success()
        run: node scripts/verify-generated-a6-pdf.mjs artifacts/dokantools-authenticated-a6.pdf artifacts/dokantools-a6-expectations.json
      - name: Upload authenticated browser evidence and fresh PDF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dokantools-v1-chromium-a6-${{ github.run_id }}
          path: |
            artifacts/dokantools-authenticated-a6.pdf
            artifacts/dokantools-a6-expectations.json
            artifacts/dokantools-a6-validation.json
            artifacts/commit-identity.json
            test-results/
          if-no-files-found: warn
      - name: Stop disposable local Supabase
        if: always()
        run: supabase stop --no-backup

name: DokanTools V1 Delivery CI
on:
  push:
    branches:
      - delivery/dokantools-v1-2026-11-19
  pull_request:
    branches:
      - delivery/dokantools-v1-2026-11-19
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y ghostscript poppler-utils
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

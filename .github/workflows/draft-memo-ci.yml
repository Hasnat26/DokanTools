name: DokanTools V1 Delivery CI
on:
  push:
    branches:
      - delivery/dokantools-v1-2026-11-19
  pull_request:
    branches:
      - delivery/dokantools-v1-2026-11-19
permissions:
  contents: read
jobs:
  application:
    name: Application build and startup
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Node dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: TypeScript check
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Start production server and smoke-test homepage
        run: |
          npm run start -- --hostname 127.0.0.1 > /tmp/dokantools-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/ -o /tmp/dokantools-home.html; then
              grep -q 'দোকানের হিসাব এখন' /tmp/dokantools-home.html
              exit $?
            fi
            sleep 2
          done
          cat /tmp/dokantools-next.log
          exit 1
  tests:
    name: Unit tests (including A6 PDF assertions)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Node dependencies
        run: npm ci
      - name: Install Poppler required by A6 tests
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Run full test suite
        run: npm test
  category-integrity:
    name: PostgreSQL 17 category tenant-integrity regression
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: dokantools_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dokantools_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Bootstrap disposable Supabase-compatible schema
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d dokantools_test -v ON_ERROR_STOP=1 -f supabase/tests/fixtures/category_integrity_schema.sql
      - name: Apply corrected category migration to disposable CI database
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d dokantools_test -v ON_ERROR_STOP=1 -f supabase/migrations/202611180001_item_categories.sql
      - name: Run positive and negative category integrity tests (transaction rolls back)
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d dokantools_test -v ON_ERROR_STOP=1 -f supabase/tests/20261119_item_categories_tenant_integrity.sql
  pdf-qa:
    name: A6 PDF artifact verification
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install PDF inspection tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Verify retained A6 PDF geometry, fonts and content
        run: node scripts/verify-a6-pdf.mjs docs/evidence/draft-memo-a6-demo.pdf

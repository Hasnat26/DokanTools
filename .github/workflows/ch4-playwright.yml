name: CH-4 Integrated Playwright browser acceptance

on:
  push:
    branches:
      - qa/ch4-playwright-browser-acceptance-2026-11-11
  pull_request:
    branches:
      - integration/ifmvp-controlled-2026-11-11
      - integration/ifmvp-controlled-candidate-2026-11-11
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ch4-integrated-playwright-${{ github.ref }}
  cancel-in-progress: true

env:
  # CH-1 candidate declaration on PR #43. Do not change without CH-1 confirmation.
  APPROVED_APP_SHA: 6cc0ce8535423a9367ed05f17ecf15e5e1d34c20
  NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: synthetic-anon-key-not-a-secret
  CI: true

jobs:
  browser-acceptance:
    name: Chromium integrated acceptance (synthetic Supabase)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout QA harness revision
        uses: actions/checkout@v4
        with:
          path: qa-harness
          fetch-depth: 1
      - name: Checkout exact application candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.APPROVED_APP_SHA }}
          path: app
          fetch-depth: 1
      - name: Verify immutable application SHA
        working-directory: app
        run: |
          ACTUAL_SHA=$(git rev-parse HEAD)
          echo "APP_TESTED_SHA=$ACTUAL_SHA" | tee tested-sha.txt
          echo "QA_HARNESS_SHA=$(git -C ../qa-harness rev-parse HEAD)" | tee -a tested-sha.txt
          test "$ACTUAL_SHA" = "$APPROVED_APP_SHA"
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install Bengali font fallback for deterministic rendering
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core
          fc-match "Noto Sans Bengali"
      - name: Install application dependencies
        working-directory: app
        run: npm ci
      - name: Install pinned Playwright runner
        working-directory: app
        run: npm install --no-save --no-package-lock @playwright/test@1.56.1
      - name: Install Chromium and OS dependencies
        working-directory: app
        run: npx playwright install --with-deps chromium
      - name: Build exact candidate application
        working-directory: app
        run: npm run build
      - name: Start exact candidate application
        working-directory: app
        run: |
          npm run start > next-start.log 2>&1 &
          echo $! > next-start.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/login > /dev/null; then
              echo "Next.js candidate is ready"
              exit 0
            fi
            sleep 2
          done
          cat next-start.log
          exit 1
      - name: Run Chromium acceptance against exact candidate
        working-directory: app
        run: npx playwright test --config=../qa-harness/qa/playwright/playwright.config.mts
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ch4-integrated-evidence-${{ github.run_id }}
          path: |
            app/playwright-report/
            app/test-results/
            app/tested-sha.txt
            app/next-start.log
          if-no-files-found: warn
          retention-days: 30

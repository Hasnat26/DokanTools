name: CH-4 Integrated Playwright browser acceptance

on:
  push:
    branches:
      - qa/ch4-playwright-browser-acceptance-2026-11-11
  pull_request:
    branches:
      - integration/ifmvp-controlled-2026-11-11
      - integration/ifmvp-controlled-candidate-2026-11-11
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ch4-integrated-playwright-${{ github.ref }}
  cancel-in-progress: false

env:
  # Fixed PR #43 application candidate. Change only through an explicit CH-1 baseline decision.
  APPROVED_APP_SHA: 6cc0ce8535423a9367ed05f17ecf15e5e1d34c20
  NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: synthetic-anon-key-not-a-secret
  CI: true

jobs:
  browser-acceptance:
    name: Chromium integrated acceptance (synthetic Supabase)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact QA harness revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: qa-harness
          fetch-depth: 1

      - name: Checkout exact application candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.APPROVED_APP_SHA }}
          path: app
          fetch-depth: 1

      - name: Record and verify immutable test baselines
        shell: bash
        run: |
          APP_SHA=$(git -C app rev-parse HEAD)
          QA_SHA=$(git -C qa-harness rev-parse HEAD)
          echo "APP_TESTED_SHA=$APP_SHA" >> "$GITHUB_ENV"
          echo "QA_HARNESS_SHA=$QA_SHA" >> "$GITHUB_ENV"
          {
            echo "APP_TESTED_SHA=$APP_SHA"
            echo "QA_HARNESS_SHA=$QA_SHA"
          } | tee qa-harness/qa/playwright/tested-sha.txt
          test "$APP_SHA" = "$APPROVED_APP_SHA"
          echo "Application SHA: $APP_SHA"
          echo "QA harness SHA: $QA_SHA"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            qa-harness/qa/playwright/package-lock.json

      - name: Install Bengali font fallback for deterministic rendering
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core poppler-utils
          fc-match "Noto Sans Bengali"
          pdffonts -v
          pdftotext -v

      - name: Install application dependencies
        working-directory: app
        run: npm ci

      - name: Install isolated QA dependencies
        working-directory: qa-harness/qa/playwright
        run: npm ci

      - name: Install Chromium and OS dependencies
        working-directory: qa-harness/qa/playwright
        run: npx playwright install --with-deps chromium

      - name: Build exact candidate application
        working-directory: app
        run: npm run build

      - name: Start exact candidate application
        working-directory: app
        run: |
          npm run start > next-start.log 2>&1 &
          echo $! > next-start.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/login > /dev/null; then
              echo "Next.js candidate is ready"
              exit 0
            fi
            sleep 2
          done
          cat next-start.log
          exit 1

      - name: Run complete Chromium acceptance suite
        id: browser_tests
        working-directory: qa-harness/qa/playwright
        run: npm test -- --config=playwright.config.mts

      - name: Verify Bengali PDF font embedding and extracted text
        if: always() && (steps.browser_tests.outcome == 'success' || steps.browser_tests.outcome == 'failure')
        working-directory: qa-harness/qa/playwright
        shell: bash
        run: |
          OUT=pdf-fidelity.txt
          if [ ! -f test-results/junit.xml ]; then
            {
              echo "Application SHA: ${APP_TESTED_SHA:-not-recorded}"
              echo "QA harness SHA: ${QA_HARNESS_SHA:-not-recorded}"
              echo "Browser acceptance did not execute; PDF Bengali fidelity NOT TESTED."
              pdffonts -v 2>&1 | head -n 2
              pdftotext -v 2>&1 | head -n 2
            } > "$OUT"
            exit 0
          fi
          if ! compgen -G "test-results/*/invoice-short.pdf" > /dev/null || ! compgen -G "test-results/*/invoice-long.pdf" > /dev/null; then
            {
              echo "Application SHA: ${APP_TESTED_SHA:-not-recorded}"
              echo "QA harness SHA: ${QA_HARNESS_SHA:-not-recorded}"
              echo "Short/long PDFs not generated; PDF Bengali fidelity NOT TESTED."
            } > "$OUT"
            exit 0
          fi
          {
            echo "Application SHA: ${APP_TESTED_SHA:-not-recorded}"
            echo "QA harness SHA: ${QA_HARNESS_SHA:-not-recorded}"
            pdffonts -v 2>&1 | head -n 2
            pdftotext -v 2>&1 | head -n 2
            for pdf in test-results/*/invoice-short.pdf test-results/*/invoice-long.pdf; do
              [ -f "$pdf" ] || continue
              echo "===== $pdf ====="
              echo "--- pdffonts ---"
              pdffonts "$pdf"
              echo "--- pdftotext -layout ---"
              pdftotext -layout "$pdf" -
            done
          } > "$OUT" 2>&1
          cat "$OUT"
          python - <<'PY'
          import glob, subprocess, sys
          pdfs = glob.glob("test-results/*/invoice-short.pdf") + glob.glob("test-results/*/invoice-long.pdf")
          failed = False
          if len(pdfs) != 2:
              print(f"Expected exactly 2 PDF files, found {len(pdfs)}")
              failed = True
          for pdf in pdfs:
              fonts = subprocess.run(["pdffonts", pdf], text=True, capture_output=True)
              extracted = subprocess.run(["pdftotext", "-layout", pdf, "-"], text=True, capture_output=True)
              text = extracted.stdout
              bengali_fonts = [line for line in fonts.stdout.splitlines() if "NotoSansBengali" in line]
              embedded = bool(bengali_fonts) and all(len(line.split()) >= 8 and line.split()[4] == "yes" and line.split()[6] == "yes" for line in bengali_fonts)
              required = ["খাবারের বিল", "ধন্যবাদ, আবার আসবেন!", "খাবার/আইটেম", "পরীক্ষামূলক খাবার ঘর", "সাদা ভাত"]
              missing = [value for value in required if value not in text]
              print(f"{pdf}: Bengali font lines={len(bengali_fonts)}, embedded={embedded}, extracted_chars={len(text)}, missing={missing}")
              if not embedded or missing or extracted.returncode != 0:
                  failed = True
              if pdf.endswith("invoice-long.pdf"):
                  for item in ["Synthetic food line 2", "Synthetic food line 28"]:
                      if item not in text:
                          print(f"Long PDF missing expected item: {item}")
                          failed = True
                  # Ensure content continues onto the second physical page.
                  pages = subprocess.run(["pdfinfo", pdf], text=True, capture_output=True)
                  page_line = next((line for line in pages.stdout.splitlines() if line.startswith("Pages:")), "")
                  if not page_line or int(page_line.split()[-1]) < 2:
                      print("Long PDF did not paginate to at least two pages")
                      failed = True
          if failed:
              sys.exit("PDF Bengali fidelity acceptance failed")
          PY

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ch4-integrated-evidence-${{ github.run_id }}
          path: |
            qa-harness/qa/playwright/playwright-report/
            qa-harness/qa/playwright/test-results/
            qa-harness/qa/playwright/tested-sha.txt
            qa-harness/qa/playwright/pdf-fidelity.txt
            app/next-start.log
          if-no-files-found: warn
          retention-days: 30
